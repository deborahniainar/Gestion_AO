version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./dev.db:/app/dev.db  # Volume pour la base SQLite
    environment:
      - DATABASE_URL=sqlite:///./dev.db
      - APP_NAME=Gestion AO
      - JWT_SECRET=change-me
    command: uvicorn app.main:app --reload --host 0.0.0.0 --port 8000

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
    depends_on:
      - backend

  # Service Redis optionnel (décommentez si nécessaire)
  # redis:
  #   image: redis:7-alpine
  #   ports:
  #     - "6379:6379"

