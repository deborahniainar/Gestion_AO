# Docker Compose helper to run OnlyOffice Document Server locally for development.
# Usage: docker compose -f docker-compose.onlyoffice.yml up -d
# This starts onlyoffice/documentserver on host port 8080.

version: '3.8'
services:
  onlyoffice-document-server:
    image: onlyoffice/documentserver:latest
    container_name: onlyoffice-document-server
    restart: unless-stopped
    ports:
      - "8080:80" # map container port 80 to host 8080
    environment:
      # Enable JWT verification inside Document Server (optional).
      # To use JWT, set JWT_ENABLED to "true" and provide JWT_SECRET.
      # Then set the same secret in backend .env as ONLYOFFICE_JWT_SECRET.
      JWT_ENABLED: "true"
      JWT_SECRET: "supersecretkey123456"
    volumes:
      - onlyoffice-data:/var/www/onlyoffice/Data
      - onlyoffice-log:/var/log/onlyoffice
      - onlyoffice-lib:/var/lib/onlyoffice

volumes:
  onlyoffice-data:
  onlyoffice-log:
  onlyoffice-lib:
